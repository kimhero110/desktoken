[package]
name = "quotabar"
version = "0.4.0-beta.2"
description = "AI coding quota floating bar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["time", "rt", "macros", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "system-proxy", "rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
keyring = { version = "3", features = ["windows-native"] }
# WMI process query for Antigravity LS discovery (no shell invocation)
wmi = "0.15"
# Shell COM for Startup-folder .lnk (IShellLinkW + IPersistFile)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
wiremock = "0.6"
sha2 = "0.10"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
