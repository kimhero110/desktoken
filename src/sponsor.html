<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    background: #1b1b20; color: rgba(255,255,255,0.92);
    padding: 16px; font-size: 13px; text-align: center;
    user-select: none;
  }
  h1 { font-size: 16px; margin-bottom: 4px; }
  .sub { color: rgba(255,255,255,0.55); font-size: 11px; margin-bottom: 10px; }
  img {
    width: 232px; height: 232px; display: block; margin: 0 auto;
    border-radius: 8px; background: #fff; padding: 6px;
    color: #333; /* 裂图时 alt 文本在白卡上可读 */
  }
  .quote {
    color: rgba(255,255,255,0.6); font-size: 11px; line-height: 1.6;
    margin-top: 10px;
  }
  .fine {
    color: rgba(255,255,255,0.5); font-size: 10px; margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>请作者喝杯咖啡</h1>
  <div class="sub">微信扫码 · 随缘打赏</div>
  <img src="sponsor.jpg" alt="微信赞赏二维码，扫码可向作者打赏；若图片未显示，GitHub README 底部有同款赞赏码" />
  <div class="quote">如果这个工具帮你躲过了一次「心流被 429 掐死」的绝望瞬间——<br/>给码农买杯咖啡，是他的福报。</div>
  <div class="fine">完全自愿，不给也能用全部功能。<br/>开源软件不兴赎金那一套。</div>
</body>
</html>
