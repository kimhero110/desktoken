<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    background: #1b1b20; color: rgba(255,255,255,0.92);
    padding: 14px 14px 12px; font-size: 13px; text-align: center;
    user-select: none;
  }
  img {
    width: 196px; height: 196px; display: block; margin: 0 auto;
    border-radius: 10px; background: #fff; padding: 5px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #333; /* 裂图时 alt 文本在白卡上可读 */
  }
  .sub { color: rgba(255,255,255,0.55); font-size: 10.5px; margin-top: 8px; }
  .fine { color: rgba(255,255,255,0.5); font-size: 10px; margin-top: 3px; }
</style>
</head>
<body>
  <img src="sponsor.jpg" alt="微信赞赏二维码，扫码可向作者打赏；若图片未显示，GitHub README 底部有同款赞赏码" />
  <div class="sub">微信扫码 · 随缘打赏</div>
  <div class="fine">完全自愿 · 功能不打折</div>
</body>
</html>
