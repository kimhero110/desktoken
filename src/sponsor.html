<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    /* 12px transparent gutter on every side: the card's shadow lives inside
       the window so no shadow is hard-clipped by the window edge */
    padding: 12px;
    cursor: pointer;
    user-select: none;
  }
  #card {
    background: rgba(18, 18, 22, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    padding: 16px;
    text-align: center;
    animation: card-in 180ms ease-out;
  }
  #card.closing { opacity: 0; transition: opacity 100ms ease-in; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  h1 { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.92); margin-bottom: 12px; }
  .qrwrap {
    width: 216px; height: 216px; margin: 0 auto 8px;
    background: #fff; border-radius: 6px; padding: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .qrwrap img { width: 200px; height: 200px; display: block; color: #333; font-size: 10px; }
  .qrwrap .qrfallback { color: #666; font-size: 10px; line-height: 1.6; display: none; }
  .qrwrap.broken img { display: none; }
  .qrwrap.broken .qrfallback { display: block; }
  .sub { color: rgba(255,255,255,0.55); font-size: 10.5px; margin-bottom: 4px; }
  .hint { color: rgba(255,255,255,0.38); font-size: 10px; }
</style>
</head>
<body>
  <div id="card" role="dialog" aria-label="微信赞赏" tabindex="-1">
    <h1 id="t-title">请作者喝杯咖啡</h1>
    <div class="qrwrap" id="qrwrap">
      <img id="qr" src="sponsor.jpg" alt="微信赞赏二维码，扫码可向作者打赏；若图片未显示，GitHub README 底部有同款赞赏码" />
      <div class="qrfallback" id="qrfallback">赞赏码加载失败<br/>GitHub README 底部有同款</div>
    </div>
    <div class="sub" id="t-sub">微信扫码 · 随缘打赏</div>
    <div class="hint" id="t-hint">点击任意处关闭 · Esc</div>
  </div>
  <script src="sponsor.js"></script>
</body>
</html>
