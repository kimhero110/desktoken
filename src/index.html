<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>QuotaBar</title>
<style>
  :root {
    --bg: rgba(18, 18, 22, 0.72);
    --border: rgba(255, 255, 255, 0.08);
    --text: rgba(255, 255, 255, 0.92);
    --text-dim: rgba(255, 255, 255, 0.55);
    --track: rgba(255, 255, 255, 0.12);
    --green: #3FB950;
    --yellow: #D29922;
    --red: #F85149;
    --stale: #8B949E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
  }
  #bar {
    /* square corners: the window is square and acrylic-backed; a rounded bar
       used to reveal gray acrylic triangles at the corners. Square bar ==
       zero reveal on every Windows version. */
    border-radius: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 8px 10px;
    cursor: move;
    /* one-shot entrance (no looping animations per design tokens) */
    animation: bar-in 220ms ease-out;
  }
  @keyframes bar-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .provider { margin-bottom: 10px; }
  .provider:last-child { margin-bottom: 0; }
  .header { display: flex; align-items: center; height: 18px; font-size: 12px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  .dot.stale { background: var(--stale); }
  .freshness { margin-left: auto; font-size: 10px; font-weight: 400; color: var(--text-dim); }
  .row {
    display: flex; align-items: center; height: 16px; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .label { width: 44px; font-size: 10px; color: var(--text-dim); }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--track); margin: 0 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 300ms ease-out, background 150ms; }
  .fill.warn { background: var(--yellow); }
  .fill.danger { background: var(--red); }
  .pct { width: 32px; text-align: right; font-size: 11px; }
  .cd { width: 44px; text-align: right; font-size: 11px; color: var(--text-dim); margin-left: 6px; }
  .errline { font-size: 10px; color: var(--stale); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .errhint { font-size: 9px; color: rgba(255,255,255,0.35); margin-top: 2px; }
  .loadingline { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
  .dimmed { opacity: 0.5; }
  .row.just-reset .fill { animation: flash-green 900ms ease-out; }
  @keyframes flash-green {
    0% { box-shadow: 0 0 0 3px rgba(63,185,80,0.65); }
    100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
  }
  #strip { display: none; height: 22px; line-height: 22px; font-size: 10px; font-weight: 600; color: var(--text); }
  #strip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin: 0 5px 1px 0; vertical-align: middle; }
  #strip #strip-title { color: var(--text-dim); font-weight: 400; }
  #strip #strip-worst { font-variant-numeric: tabular-nums; margin-left: 5px; }
  #strip #strip-msg {
    float: right; max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    color: var(--text-dim); font-weight: 400; font-style: italic;
  }
  #notice {
    display: none; font-size: 10px; color: var(--text-dim); line-height: 1.5;
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  #updatebar {
    display: none; font-size: 10px; line-height: 1.6; color: #1b1b1f;
    background: #D29922; border-radius: 6px; padding: 4px 8px; margin-bottom: 10px;
  }
  #updatebar a { color: #1b1b1f; font-weight: 600; }
  #updatebar .x { float: right; cursor: pointer; padding: 0 2px; }
  #updatebar .skip { cursor: pointer; text-decoration: underline; }
  #bar.flash { border-color: var(--red) !important; transition: none; }
  #empty { padding: 12px 6px; text-align: center; }
  #empty .t1 { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  #empty .t2 { font-size: 10px; color: var(--text-dim); }
  body.mini #bar > .provider, body.mini #bar > #empty, body.mini #bar > #notice, body.mini #bar > #updatebar, body.mini #bar > #detail { display: none !important; }
  body.mini #bar { padding: 0 10px; }
  body.mini #strip { display: block; }

  /* ---- detail panel (left-click toggles; Mac menu-bar convention) ---- */
  #detail {
    display: none; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
    animation: detail-in 180ms ease-out;
  }
  #detail.open { display: block; }
  @keyframes detail-in {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: none; }
  }
  .d-provider { margin-bottom: 10px; }
  .d-provider:last-child { margin-bottom: 0; }
  .d-head { display: flex; align-items: baseline; font-size: 11px; font-weight: 600; }
  .d-meta { margin-left: auto; font-size: 9px; font-weight: 400; color: var(--text-dim); }
  .d-win { font-size: 10px; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }
  .d-win b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .d-actions { margin-top: 4px; font-size: 10px; }
  .d-actions a { color: #58a6ff; cursor: pointer; text-decoration: none; margin-right: 10px; }
  .d-actions a:hover { text-decoration: underline; }
  .spark { display: block; margin-top: 4px; width: 100%; height: 26px; }
  .suggest {
    font-size: 10px; color: var(--yellow); margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--border); line-height: 1.5;
  }
</style>
</head>
<body>
<div id="bar">
  <div id="strip"><span class="dot" id="strip-dot"></span><span id="strip-title">QuotaBar</span><span id="strip-worst"></span><span id="strip-msg"></span></div>
  <div id="updatebar"><span class="x" id="up-x">×</span><span id="up-text"></span> <a href="#" id="up-view">查看</a> · <span class="skip" id="up-skip">跳过此版本</span></div>
  <div id="notice"></div>
  <div id="empty">
    <div class="t1" id="empty-t1">还没有配置任何平台</div>
    <div class="t2" id="empty-t2">右键 → 设置，添加或启用平台</div>
  </div>
  <div id="providers"></div>
  <div id="detail"></div>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const listen = window.__TAURI__.event.listen;
  const bar = document.getElementById("bar");
  const providersEl = document.getElementById("providers");
  const emptyEl = document.getElementById("empty");
  const detailEl = document.getElementById("detail");
  const snapshots = new Map(); // provider_id -> snapshot
  const prevResets = new Map(); // "id/label" -> last resets_at (for reset flash)
  const pendingInit = new Set(); // provider ids awaiting their first snapshot

  // ---- i18n (system language; backend error text arrives ready-to-show) ----
  const isZh = (navigator.language || '').startsWith('zh');
  const I18N = {
    stripTitle: "QuotaBar",
    emptyT1: isZh ? "还没有配置任何平台" : "No providers configured",
    emptyT2: isZh ? "右键 → 设置，添加或启用平台" : "Right-click → Settings to add providers",
    refreshing: isZh ? "等待刷新…" : "Refreshing…",
    justNow: isZh ? "刚刚" : "just now",
    minAgo: isZh ? " 分钟前" : "m ago",
    hourAgo: isZh ? " 小时前" : "h ago",
    autoEnabled: (names) => isZh
      ? `已自动启用 ${names.join(" · ")}，可在设置中关闭`
      : `Auto-enabled: ${names.join(", ")} — disable in Settings`,
    noCred: isZh ? "未检测到 CLI 凭据，右键 → 设置手动添加" : "No CLI credentials detected — right-click → Settings",
    loading: isZh ? "获取中…" : "Fetching…",
    used: isZh ? "已用" : "used",
    remain: isZh ? "剩余" : "left",
    resetsAt: isZh ? "重置" : "resets",
    officialPage: isZh ? "官方页面" : "Official page",
    refreshNow: isZh ? "立即刷新" : "Refresh now",
    errHint: isZh ? "提示：右键可打开选项菜单" : "Tip: right-click for options",
  };
  document.getElementById("strip-title").textContent = I18N.stripTitle;
  document.getElementById("empty-t1").textContent = I18N.emptyT1;
  document.getElementById("empty-t2").textContent = I18N.emptyT2;

  const OFFICIAL = {
    kimi: "https://platform.moonshot.cn/console",
    glm: "https://open.bigmodel.cn/",
    codex: "https://chatgpt.com/codex",
    claude: "https://claude.ai/settings/usage",
    gemini: "https://antigravity.google",
  };

  // ---- formatting helpers (design spec: 43m / 2.1h / 3d4h / — / 等待刷新…) ----
  function fmtCountdown(resetsAt) {
    if (!resetsAt) return "—";
    const d = resetsAt - Date.now() / 1000;
    if (d <= 0) return I18N.refreshing;
    if (d < 3600) return Math.max(1, Math.round(d / 60)) + "m";
    if (d < 86400) return (Math.round(d / 360) / 10).toFixed(1).replace(/\.0$/, "") + "h";
    return Math.floor(d / 86400) + "d" + Math.round((d % 86400) / 3600) + "h";
  }
  function fmtFresh(fetchedAt, hasError) {
    if (hasError) return "";
    const d = Math.max(0, Date.now() / 1000 - fetchedAt);
    if (d < 90) return I18N.justNow;
    if (d < 3600) return Math.round(d / 60) + I18N.minAgo;
    return Math.round(d / 3600) + I18N.hourAgo;
  }
  function fmtAbsTime(epochSecs) {
    const dt = new Date(epochSecs * 1000);
    const today = new Date();
    const sameDay = dt.toDateString() === today.toDateString();
    const hm = `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
    if (sameDay) return (isZh ? "今天 " : "today ") + hm;
    return `${dt.getMonth() + 1}/${dt.getDate()} ${hm}`;
  }
  function isStale(fetchedAt) {
    return Date.now() / 1000 - fetchedAt > 600;
  }
  function fillClass(pct) { return pct >= 90 ? "fill danger" : pct >= 70 ? "fill warn" : "fill"; }
  function esc(t) { const d = document.createElement("div"); d.textContent = String(t); return d.innerHTML; }

  // ---- ≥90% actionable suggestion (design spec: point at the roomy sibling) ----
  function suggestion() {
    let tight = null;
    let roomy = null;
    for (const s of snapshots.values()) {
      if (s.error) continue;
      for (const w of s.windows) {
        if (w.used_percent >= 90 && (!tight || w.used_percent > tight.w.used_percent)) tight = { s, w };
        if ((w.label === "周" || w.label === "滚动") && w.used_percent < 70 && (!roomy || w.used_percent < roomy.w.used_percent)) roomy = { s, w };
      }
    }
    if (tight && roomy && tight.s.provider_id !== roomy.s.provider_id) {
      return isZh
        ? `${tight.s.provider_name} ${tight.w.label} 已 ${Math.round(tight.w.used_percent)}%——${roomy.s.provider_name} ${roomy.w.label} 仅用 ${Math.round(roomy.w.used_percent)}%，先去那边写`
        : `${tight.s.provider_name} ${tight.w.label} at ${Math.round(tight.w.used_percent)}% — ${roomy.s.provider_name} is only ${Math.round(roomy.w.used_percent)}%`;
    }
    return null;
  }

  // ---- renderer ----
  function render() {
    providersEl.innerHTML = "";
    emptyEl.style.display = (snapshots.size === 0 && pendingInit.size === 0) ? "" : "none";
    // loading placeholders for providers that haven't answered yet
    for (const pid of pendingInit) {
      if (snapshots.has(pid)) continue;
      const div = document.createElement("div");
      div.className = "provider";
      div.innerHTML = `<div class="header"><span class="dot stale"></span>${esc(pid)}<span class="freshness"></span></div><div class="loadingline">${I18N.loading}</div>`;
      providersEl.appendChild(div);
    }
    let worst = 0;
    let errHintShown = false;
    try { errHintShown = localStorage.getItem("err-hint-shown") === "1"; } catch (e) {}
    for (const [id, s] of snapshots) {
      const div = document.createElement("div");
      div.className = "provider";
      const stale = isStale(s.fetched_at);
      let html = `<div class="header"><span class="dot${stale || s.error ? " stale" : ""}"></span>${esc(s.provider_name)}<span class="freshness">${fmtFresh(s.fetched_at, !!s.error)}</span></div>`;
      if (s.error && s.windows.length === 0) {
        html += `<div class="errline">${esc(s.error)}</div>`;
        if (!errHintShown) {
          html += `<div class="errhint">${I18N.errHint}</div>`;
          try { localStorage.setItem("err-hint-shown", "1"); } catch (e) {}
          errHintShown = true;
        }
      }
      for (const w of s.windows) {
        worst = Math.max(worst, w.used_percent);
        const dim = stale ? " dimmed" : "";
        // reset flash: resets_at jumped forward => a new cycle began
        const key = id + "/" + w.label;
        const prev = prevResets.get(key);
        const justReset = prev && w.resets_at && w.resets_at > prev && w.resets_at > Date.now() / 1000 - 300;
        prevResets.set(key, w.resets_at);
        html += `<div class="row${dim}${justReset ? " just-reset" : ""}" title="${esc(s.provider_name)} · ${esc(w.label)} 窗口&#10;已用 ${Math.round(w.used_percent)}%&#10;来源: ${s.source === "official" ? "官方接口" : s.source === "manual_key" ? "手动 key" : "响应头估算"}${s.plan ? " · " + esc(s.plan) : ""}">
          <span class="label">${esc(w.label)}</span>
          <div class="bar"><div class="${fillClass(w.used_percent)}" style="width:${w.used_percent.toFixed(1)}%"></div></div>
          <span class="pct">${Math.round(w.used_percent)}%</span>
          <span class="cd">${fmtCountdown(w.resets_at)}</span>
        </div>`;
      }
      div.innerHTML = html;
      div.setAttribute("aria-label", `${s.provider_name} ${s.windows.map(w => `${w.label}已用${Math.round(w.used_percent)}%`).join(" ")}`);
      providersEl.appendChild(div);
    }
    // strip status dot + ambient border alert follow worst window (design spec)
    const dot = document.getElementById("strip-dot");
    const worstColor = worst >= 90 ? "#F85149" : worst >= 70 ? "#D29922" : "#3FB950";
    dot.style.background = worstColor;
    bar.style.borderColor = worst >= 90 ? "#F85149" : worst >= 70 ? "#D29922" : "rgba(255,255,255,0.08)";
    const sw = document.getElementById("strip-worst");
    if (snapshots.size > 0) {
      sw.textContent = Math.round(worst) + "%";
      sw.style.color = worstColor;
    } else {
      sw.textContent = "";
    }
    renderDetail();
    refit();
  }

  // ---- detail panel (click to toggle; Mac menu-bar convention) ----
  let detailOpen = false;
  const historyCache = new Map(); // provider_id -> {label: [(ts,pct)]}

  function renderDetail() {
    if (!detailOpen) { detailEl.classList.remove("open"); detailEl.innerHTML = ""; return; }
    let html = "";
    for (const [id, s] of snapshots) {
      if (s.error && s.windows.length === 0) continue;
      const meta = [s.plan, s.source === "official" ? "官方接口" : s.source === "manual_key" ? "手动 key" : "估算"]
        .filter(Boolean).join(" · ");
      html += `<div class="d-provider"><div class="d-head">${esc(s.provider_name)}<span class="d-meta">${esc(meta)}</span></div>`;
      for (const w of s.windows) {
        const remain = Math.max(0, 100 - w.used_percent);
        html += `<div class="d-win">${esc(w.label)}：${I18N.used} <b>${Math.round(w.used_percent)}%</b>（${I18N.remain} ${Math.round(remain)}%）${w.resets_at ? ` · ${I18N.resetsAt} ${fmtAbsTime(w.resets_at)}` : ""}</div>`;
        const hist = historyCache.get(id + "/" + w.label);
        if (hist && hist.length > 2) {
          html += `<canvas class="spark" data-series="${id}/${w.label}" width="260" height="26"></canvas>`;
        }
      }
      const link = OFFICIAL[id];
      html += `<div class="d-actions">${link ? `<a data-url="${link}">${I18N.officialPage}</a>` : ""}<a data-refresh="1">${I18N.refreshNow}</a></div></div>`;
    }
    const sug = suggestion();
    if (sug) html += `<div class="suggest">${esc(sug)}</div>`;
    detailEl.innerHTML = html;
    detailEl.classList.add("open");
    detailEl.querySelectorAll("a[data-url]").forEach(a =>
      a.addEventListener("click", () => invoke("open_url", { url: a.dataset.url })));
    detailEl.querySelectorAll("a[data-refresh]").forEach(a =>
      a.addEventListener("click", () => invoke("refresh_now_cmd")));
    detailEl.querySelectorAll("canvas.spark").forEach(drawSpark);
  }

  function drawSpark(canvas) {
    const hist = historyCache.get(canvas.dataset.series);
    if (!hist || hist.length < 3) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const t0 = hist[0][0], t1 = hist[hist.length - 1][0];
    const span = Math.max(1, t1 - t0);
    // track
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H - 1); ctx.lineTo(W, H - 1); ctx.stroke();
    // area fill
    ctx.beginPath();
    hist.forEach(([t, p], i) => {
      const x = (t - t0) / span * W;
      const y = H - 3 - (Math.min(100, Math.max(0, p)) / 100) * (H - 6);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    const lastPct = hist[hist.length - 1][1];
    const col = lastPct >= 90 ? "#F85149" : lastPct >= 70 ? "#D29922" : "#3FB950";
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = col + "22"; ctx.fill();
  }

  function toggleDetail() {
    detailOpen = !detailOpen;
    if (detailOpen) {
      // pull history for sparklines, then render
      const ids = Array.from(snapshots.keys());
      Promise.all(ids.map(id => invoke("get_history", { providerId: id }).then(h => {
        for (const [label, series] of Object.entries(h)) historyCache.set(id + "/" + label, series);
      }).catch(() => {}))).then(renderDetail);
    }
    renderDetail();
    refit();
  }

  // ---- layout ownership (frontend owns height; kills the dead zone) ----
  function refit() {
    const mini = document.body.classList.contains("mini");
    if (mini) {
      document.getElementById("strip-msg").textContent = stripMessage();
      const w = Math.min(360, Math.max(140, document.getElementById("strip").scrollWidth + 22));
      invoke("autosize", { height: 22, width: w });
    } else {
      invoke("autosize", { height: bar.offsetHeight, width: null });
    }
  }
  window.addEventListener("load", refit);

  // ---- mini strip: quota-aware messages (memes yield to advice when tight) ----
  const MEMES = [
    "它在我机器上是好的", "先重启试试", "这不是 bug，是 feature", "编译中 ≈ 带薪休假",
    "改一个 bug，冒出俩", "TODO: 以后再优化", "生产环境才是测试环境",
    "复制粘贴也是一种复用", "周五别 force push", "这个临时方案已经三年了",
    "每个 else 都是一次妥协", "先有 README 再有真相", "缓存和命名是两大难题",
    "代码能跑就别动", "写注释是给自己留情面",
  ];
  function stripMessage() {
    const sug = suggestion();
    if (sug) return sug; // ≥90%: the joke yields to routing advice
    const now = new Date();
    const h = now.getHours();
    const d = now.getDay();
    if (h >= 23 || h < 5) return "夜深了，眼睛和颈椎都重要";
    if (h < 9) return "早，先喝水再写代码";
    if (h >= 11 && h < 13) return "到点了，先吃饭";
    if (h >= 17 && h < 19) return "下班前记得提交";
    if (d === 5 && h >= 15) return "周五下午，别开新坑";
    if (d === 1 && h < 10) return "周一早上，慢慢来";
    return MEMES[Math.floor(Date.now() / 30000) % MEMES.length];
  }

  // ---- events ----
  listen("quota://snapshot", (ev) => {
    const s = ev.payload;
    pendingInit.delete(s.provider_id);
    snapshots.set(s.provider_id, s);
    render();
  });
  listen("providers-init", (ev) => {
    for (const p of ev.payload || []) {
      if (!snapshots.has(p.id)) pendingInit.add(p.id);
    }
    render();
  });
  // hot reload: an instance was disabled in settings — drop its row now
  listen("provider-removed", (ev) => {
    const id = ev.payload;
    snapshots.delete(id);
    pendingInit.delete(id);
    historyCache.clear(); // cheap: stale series for a gone id are harmless
    render();
  });
  listen("mini-mode", (ev) => {
    document.body.classList.toggle("mini", ev.payload);
    refit();
  });
  listen("refit", refit);
  listen("settings-changed", (ev) => {
    bar.style.background = `rgba(18, 18, 22, ${ev.payload.opacity})`;
  });
  listen("tos-accepted", (ev) => {
    const names = ev.payload || [];
    const el = document.getElementById("notice");
    el.textContent = names.length ? I18N.autoEnabled(names) : I18N.noCred;
    el.style.display = "";
    refit();
    setTimeout(() => { el.style.display = "none"; refit(); }, 3000);
  });
  listen("alert-flash", () => {
    bar.classList.add("flash");
    setTimeout(() => bar.classList.remove("flash"), 400);
  });
  listen("update-available", (ev) => {
    const info = ev.payload;
    const ub = document.getElementById("updatebar");
    document.getElementById("up-text").textContent = isZh
      ? `有新版本 v${info.version}`
      : `New version v${info.version}`;
    ub.style.display = "block";
    ub.dataset.version = info.version;
    ub.dataset.url = info.url;
    refit();
  });
  document.getElementById("up-view").addEventListener("click", (e) => {
    e.preventDefault();
    const ub = document.getElementById("updatebar");
    invoke("open_url", { url: ub.dataset.url });
  });
  document.getElementById("up-skip").addEventListener("click", () => {
    const ub = document.getElementById("updatebar");
    invoke("skip_version", { version: ub.dataset.version });
    ub.style.display = "none"; refit();
  });
  document.getElementById("up-x").addEventListener("click", () => {
    document.getElementById("updatebar").style.display = "none"; refit();
  });

  // countdown + freshness refresh every 30s (design: no per-second jumps)
  setInterval(render, 30000);

  // ---- drag & click-to-detail & menu ----
  // Pure-JS click vs drag detection; only an actual drag calls begin_drag.
  let downAt = null;
  bar.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    downAt = { x: e.screenX, y: e.screenY, t: Date.now(), dragging: false };
  });
  window.addEventListener("mousemove", (e) => {
    if (!downAt || downAt.dragging) return;
    if (Math.hypot(e.screenX - downAt.x, e.screenY - downAt.y) > 4) {
      downAt.dragging = true;
      invoke("begin_drag");
    }
  });
  window.addEventListener("mouseup", (e) => {
    if (e.button !== 0 || !downAt) return;
    const wasDrag = downAt.dragging;
    const dt = Date.now() - downAt.t;
    downAt = null;
    if (!wasDrag && dt < 500) toggleDetail();
  });
  bar.addEventListener("contextmenu", (e) => { e.preventDefault(); invoke("context_menu"); });

  // ---- init ----
  invoke("get_settings").then((s) => {
    bar.style.background = `rgba(18, 18, 22, ${s.opacity})`;
    if (s.mini_mode) document.body.classList.add("mini");
  });
</script>
</body>
</html>
