name: Release QuotaBar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Standalone Executable & Bundle
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 'QuotaBar ${{ github.ref_name }}'
          body: |
            ## 📊 QuotaBar Release ${{ github.ref_name }}
            
            ### 🌟 What's New
            - Non-intrusive acrylic desktop floating status bar for Windows 10/11
            - Real-time tracking for Claude 5-hour rolling window, Kimi, Codex, and GLM
            - Universal Custom Provider JSON engine
            - Zero telemetry, 100% local credentials storage
            
            ### 💾 Installation
            - **`QuotaBar_x64-setup.exe`**: Standard Windows installer (NSIS)
            - **`quotabar.exe`**: Portable standalone executable (no installation required)
          files: |
            src-tauri/target/release/quotabar.exe
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
