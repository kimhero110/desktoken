name: Release QuotaBar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & Bundle
        run: |
          cd src-tauri
          npx --yes @tauri-apps/cli@2.11.4 build ${{ matrix.args }} -- --locked

      - name: Generate checksums
        shell: bash
        run: |
          cd src-tauri/target/release
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            FILES="quotabar.exe $(ls bundle/nsis/*.exe 2>/dev/null)"
            HASHER="sha256sum"
          else
            FILES="quotabar $(ls bundle/dmg/*.dmg 2>/dev/null)"
            HASHER="shasum -a 256"
          fi
          : > checksums-${{ matrix.platform }}.txt
          for f in $FILES; do $HASHER "$f" >> checksums-${{ matrix.platform }}.txt; done
          cat checksums-${{ matrix.platform }}.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/quotabar*
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 'QuotaBar ${{ github.ref_name }}'
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          make_latest: false
          files: |
            src-tauri/target/release/quotabar.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/checksums-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
