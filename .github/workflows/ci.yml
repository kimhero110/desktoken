name: CI

on:
  push:
    branches: [main]
  pull_request:

# Independent jobs so a failure in one gate does not mask the others
# (e.g. a macOS compile error must not hide a rustfmt violation).
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --all --check
        working-directory: src-tauri

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS was build-only before; its code paths (keyring apple-native,
        # CFLocale UI language) had never been exercised by tests.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend regression tests
        run: node --test tests/*.test.cjs
      - name: Test
        run: |
          cd src-tauri
          cargo test --locked
      - name: Build (dev, catches platform-specific issues)
        run: |
          cd src-tauri
          cargo build --locked
      - name: Native task lifecycle (isolated, no accounts required)
        # Task monitor is Windows-only (registry/DACL/paths); macOS has no hook.
        if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: |
          node scripts/test-task-bridge.cjs
          node scripts/test-task-lifecycle.cjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Supply-chain audit (RUSTSEC advisory DB)
        # Ships reqwest / rusqlite(bundled) / keyring — a known CVE would
        # undercut the whole "credentials never leave your machine" promise.
        run: |
          cargo install --locked cargo-audit
          cargo audit
        working-directory: src-tauri
