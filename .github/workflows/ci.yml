name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          cd src-tauri
          cargo fmt --check

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend regression tests
        run: node --test tests/*.test.cjs
      - name: Clippy
        run: |
          cd src-tauri
          cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cd src-tauri
          cargo test --locked
      - name: Build (dev, catches windows-specific issues)
        run: |
          cd src-tauri
          cargo build --locked
      - name: Native task lifecycle (isolated, no accounts required)
        timeout-minutes: 3
        run: |
          node scripts/test-task-bridge.cjs
          node scripts/test-task-lifecycle.cjs
