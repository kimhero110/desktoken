name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Test
        run: |
          cd src-tauri
          cargo test
      - name: Build (dev, catches windows-specific issues)
        run: |
          cd src-tauri
          cargo build
